{% extends "base.html" %}

{% block title %}
Create Quiz
{% endblock %}

{% block content %}

<h1>Create Quiz</h1>

<form method="POST">

    <div class="form-group">
        <label>Name of the quiz</label>
        <input type="text" name="quiz_name" class="form-control" required>
    </div>

    <div id="terms-container">

        <div class="row mb-3">
            <div class="col">
                <input type="text" name="term" class="form-control" placeholder="Term" required>
            </div>

            <div class="col">
                <input type="text" name="definition" class="form-control" placeholder="Definition / translation" required>
            </div>
        </div>

    </div>

    <button type="button" class="btn btn-secondary" onclick="addTerm()">Add term</button>

    <button type="submit" class="btn btn-primary">Finish quiz</button>

</form>

<script>
function addTerm() {
    let container = document.getElementById("terms-container");

    let newRow = document.createElement("div");
    newRow.className = "row mb-3";

    newRow.innerHTML = `
        <div class="col">
            <input type="text" name="term" class="form-control" placeholder="Term" required>
        </div>

        <div class="col">
            <input type="text" name="definition" class="form-control" placeholder="Definition / translation" required>
        </div>
    `;

    container.appendChild(newRow);
}
</script>

{% endblock %}
